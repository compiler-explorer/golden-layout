# Releases with Release Please. Each push to ce-main updates a release PR that
# bumps the version and changelog from the conventional-commit titles merged
# since the last release. Merging that PR tags the release, and the publish
# job below then publishes it to npm.
#
# npm's Trusted Publisher for this package names this file (publish.yml), so
# keep the publish job here, under this name.
name: Release

on:
  push:
    branches: [ ce-main ]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags and GitHub releases
      pull-requests: write # the release PR
      issues: write # release-please labels its PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check the package contents
        # npm pack runs the build (the prepack script) first.
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          for file in dist/goldenlayout.js dist/goldenlayout.min.js src/css/goldenlayout-base.css index.d.ts; do
            node -e 'process.exit(require(process.env.RUNNER_TEMP + "/pack.json")[0].files.some(f => f.path === process.argv[1]) ? 0 : 1)' "$file" ||
              { echo "The package is missing $file"; exit 1; }
          done

      - run: npm publish --provenance
