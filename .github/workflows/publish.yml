name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check the committed build output is up to date
        run: |
          npm run build
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "The committed build output is stale: run 'npm run build' and commit the result."
            exit 1
          fi

      - run: npm publish --provenance
