# Release Please builds the changelog and picks the next version from commit
# messages, and PRs are squash-merged with the PR title as the message, so the
# title must be a conventional commit: feat: (minor bump), fix: (patch bump),
# or chore:, docs:, ci:, build:, test:, refactor: (no release).
name: PR title

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
