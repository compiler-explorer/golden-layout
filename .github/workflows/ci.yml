name: CI

on:
  push:
    branches: [ ce-main ]
  pull_request:

jobs:
  build-and-test:
    # The tests drive the runner's preinstalled Chrome through Playwright
    # (channel 'chrome' in vitest.config.mjs), so no browser download is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: npm test

      - name: Check the package contents
        # npm pack runs the build (the prepack script) first.
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          for file in dist/goldenlayout.js dist/goldenlayout.min.js src/css/goldenlayout-base.css index.d.ts; do
            node -e 'process.exit(require(process.env.RUNNER_TEMP + "/pack.json")[0].files.some(f => f.path === process.argv[1]) ? 0 : 1)' "$file" ||
              { echo "The package is missing $file"; exit 1; }
          done
