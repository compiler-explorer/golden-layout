name: CI

on:
  push:
    branches: [ ce-main ]
  pull_request:

jobs:
  build-and-test:
    # The tests drive the runner's preinstalled Chrome through Playwright
    # (channel 'chrome' in vitest.config.mjs), so no browser download is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: npm test

      - name: Build distributable
        run: npm run build

      - name: Check the committed build output is up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "The committed build output is stale: run 'npm run build' and commit the result."
            exit 1
          fi
